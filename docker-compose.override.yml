services:
  backend:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app
    command: sh -c "go mod tidy && go run ."

  frontend:
    build:
      context: ./frontend
      target: deps
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- -H 0.0.0.0 -p 3000"
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_SOCKET_URL: http://localhost:8080
